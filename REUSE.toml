version = 1

# Generated build outputs (regenerated by `npm run build`) cannot reliably carry
# an SPDX comment header, so their licensing is declared here per the REUSE spec.
[[annotations]]
path = ["css/**", "js/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Touchpoint Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Binary/asset files that cannot carry a text comment header.
[[annotations]]
path = ["img/**", "screenshots/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Touchpoint Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# JSON config / lockfiles cannot hold comments, so their licensing is declared
# here rather than via an inline header or a .license sidecar.
[[annotations]]
path = ["composer.json", "composer.lock", "package.json", "package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Touchpoint Contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Root LICENSE file (full AGPL-3.0 text) for GitHub license detection.
[[annotations]]
path = ["LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "AGPL-3.0-or-later"
